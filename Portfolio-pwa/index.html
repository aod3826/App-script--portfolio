<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager - ศูนย์รวมผลงาน</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portfolio">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary:      #6366f1;
            --primary-dark: #4f46e5;
            --secondary:    #ec4899;
            --success:      #10b981;
            --warning:      #f59e0b;
            --danger:       #ef4444;
            --bg-dark:      #0f172a;
            --bg-card:      #1e293b;
            --text-light:   #e2e8f0;
            --text-muted:   #94a3b8;
            --border:       #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header { text-align: center; margin-bottom: 40px; animation: slideDown 0.6s ease-out; }
        .header h1 {
            font-size: 3em; margin-bottom: 10px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            font-weight: 800; letter-spacing: -1px;
        }
        .header p { color: var(--text-muted); font-size: 1.1em; }

        /* Control Panel */
        .control-panel {
            display: grid; grid-template-columns: 1fr 1fr auto;
            gap: 15px; margin-bottom: 30px; animation: slideUp 0.6s ease-out 0.1s both;
        }

        .search-box, .sort-select {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 18px; color: var(--text-light);
            font-size: 1em; transition: all 0.3s ease;
        }
        .search-box:focus, .sort-select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 10px; font-size: 1em;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }
        .btn-secondary { background: var(--bg-card); color: var(--text-light); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;
        }
        .modal.active { display: flex; justify-content: center; align-items: center; }
        .modal-content {
            background: var(--bg-card); padding: 30px; border-radius: 15px;
            max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;
            border: 1px solid var(--border); animation: slideUp 0.3s ease;
        }
        .modal-header {
            font-size: 1.8em; font-weight: 700; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { background: none; border: none; color: var(--text-light); font-size: 1.5em; cursor: pointer; }
        .close-btn:hover { transform: rotate(90deg); transition: transform 0.2s; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-light); font-family: inherit; font-size: 1em;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .form-group textarea { resize: vertical; min-height: 100px; }

        /* Image Upload */
        .image-upload {
            border: 2px dashed var(--primary); border-radius: 10px; padding: 20px;
            text-align: center; cursor: pointer; background: rgba(99, 102, 241, 0.1); transition: all 0.3s;
        }
        .image-upload:hover, .image-upload.drag-over { background: rgba(99, 102, 241, 0.25); }
        .image-preview { margin-top: 15px; }
        .image-preview img { max-width: 100%; max-height: 200px; border-radius: 8px; }

        /* Portfolio Grid */
        .portfolio-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px; animation: fadeIn 0.6s ease 0.2s both;
        }
        .portfolio-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 15px;
            overflow: hidden; transition: all 0.3s ease; position: relative; animation: scaleIn 0.4s ease;
        }
        .portfolio-card:hover {
            transform: translateY(-8px); border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
        }
        .portfolio-image {
            width: 100%; height: 200px; overflow: hidden;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(236,72,153,0.2));
        }
        .portfolio-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .portfolio-card:hover .portfolio-image img { transform: scale(1.05); }
        .portfolio-image.no-image { display: flex; align-items: center; justify-content: center; font-size: 3em; color: var(--text-muted); }
        .portfolio-content { padding: 20px; }
        .portfolio-title { font-size: 1.3em; font-weight: 700; margin-bottom: 8px; }
        .portfolio-category {
            display: inline-block; background: rgba(99,102,241,0.2); color: var(--primary);
            padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: 600; margin-bottom: 10px;
        }
        .portfolio-description { color: var(--text-muted); font-size: 0.95em; margin-bottom: 15px; line-height: 1.5; }
        .portfolio-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .tag {
            background: rgba(236,72,153,0.2); color: var(--secondary); padding: 4px 10px;
            border-radius: 6px; font-size: 0.8em;
        }
        .portfolio-date { color: var(--text-muted); font-size: 0.85em; margin-bottom: 15px; }
        .portfolio-actions { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border); background: transparent;
            color: var(--text-light); border-radius: 8px; cursor: pointer; font-weight: 600;
            font-size: 0.9em; transition: all 0.2s ease; display: flex; align-items: center;
            justify-content: center; gap: 6px; text-decoration: none;
        }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .action-btn.copy:hover { background: var(--secondary); border-color: var(--secondary); }
        .action-btn.delete { color: var(--danger); }
        .action-btn.delete:hover { background: var(--danger); border-color: var(--danger); color: white; }

        /* Empty State */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 4em; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h3 { font-size: 1.5em; margin-bottom: 10px; }

        /* Loading */
        .loading-state { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; padding: 60px; gap: 16px; color: var(--text-muted); }
        .spinner { border: 3px solid rgba(99,102,241,0.2); border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--success);
            color: white; padding: 15px 25px; border-radius: 10px; font-weight: 600;
            animation: slideIn 0.3s ease; z-index: 2000; max-width: 320px;
        }
        .toast.error { background: var(--danger); }
        .toast.info  { background: var(--primary); }

        /* PWA Banner */
        .pwa-banner {
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--primary); border-radius: 14px;
            padding: 14px 20px; box-shadow: 0 8px 30px rgba(99,102,241,0.4); z-index: 1500;
            gap: 14px; align-items: center; min-width: 300px; max-width: 90vw;
        }
        .pwa-banner.show { display: flex; }
        .pwa-banner-icon { font-size: 2em; flex-shrink: 0; }
        .pwa-banner-text { flex: 1; }
        .pwa-banner-text strong { display: block; color: var(--text-light); font-size: 0.95em; }
        .pwa-banner-text span { color: var(--text-muted); font-size: 0.8em; }
        .pwa-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .pwa-install-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;
            border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 0.85em; cursor: pointer;
        }
        .pwa-dismiss-btn {
            background: transparent; color: var(--text-muted); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 12px; font-size: 0.85em; cursor: pointer;
        }

        /* Offline Bar */
        .offline-bar {
            display: none; position: fixed; top: 0; left: 0; right: 0;
            background: var(--warning); color: #000; text-align: center;
            padding: 8px; font-weight: 700; font-size: 0.9em; z-index: 3000;
        }
        .offline-bar.show { display: block; }

        /* Animations */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp   { from { opacity: 0; transform: translateY(30px);  } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn   { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn   { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin      { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; }
            .header h1 { font-size: 2em; }
            .portfolio-grid { grid-template-columns: 1fr; }
            .modal-content { max-width: 95%; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="offline-bar" id="offlineBar">📡 คุณกำลังใช้งานในโหมด Offline</div>

    <div class="container">
        <div class="header">
            <h1>🎨 Portfolio Manager</h1>
            <p>ศูนย์รวมผลงานดิจิทัลของคุณ</p>
        </div>

        <div class="control-panel">
            <input type="text" id="searchBox" class="search-box" placeholder="🔍 ค้นหาผลงาน...">
            <select id="sortSelect" class="sort-select">
                <option value="new">🆕 ใหม่ก่อน</option>
                <option value="old">🕰️ เก่าก่อน</option>
                <option value="a-z">🔤 ชื่อ A-Z</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-primary" id="addBtn">➕ เพิ่มผลงาน</button>
                <button class="btn btn-secondary" id="refreshBtn">🔄 รีเฟรช</button>
            </div>
        </div>

        <div class="portfolio-grid" id="portfolioGrid">
            <div class="loading-state"><div class="spinner"></div><span>กำลังโหลด...</span></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">➕ เพิ่มผลงานใหม่</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="portfolioForm">
                <div class="form-group">
                    <label>ชื่อผลงาน *</label>
                    <input type="text" id="f_title" required placeholder="เช่น Todo App">
                </div>
                <div class="form-group">
                    <label>คำอธิบาย *</label>
                    <textarea id="f_description" required placeholder="อธิบายผลงานของคุณ..."></textarea>
                </div>
                <div class="form-group">
                    <label>URL ผลงาน *</label>
                    <input type="url" id="f_url" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>หมวดหมู่ *</label>
                    <input type="text" id="f_category" required placeholder="เช่น Web App, AI Tool, Game">
                </div>
                <div class="form-group">
                    <label>Tags (คั่นด้วยจุลภาค)</label>
                    <input type="text" id="f_tags" placeholder="react, javascript, portfolio">
                </div>
                <div class="form-group">
                    <label>URL รูปภาพ (ลิงก์รูป)</label>
                    <input type="url" id="f_image_url" placeholder="https://i.imgur.com/xxx.jpg">
                    <p style="color:var(--text-muted);font-size:0.8em;margin-top:6px;">
                        💡 แนะนำใช้ลิงก์รูป เช่น Imgur, Cloudinary หรือ GitHub raw
                    </p>
                </div>
                <div class="form-group">
                    <label>หรืออัพโหลดรูป (เก็บเป็น Base64 สำหรับรูปขนาดเล็ก)</label>
                    <div class="image-upload" id="imageUpload">
                        <div>📸 ลากรูปมาวางที่นี่ หรือ คลิกเพื่อเลือก</div>
                        <input type="file" id="f_imageFile" style="display:none;" accept="image/*">
                    </div>
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <div class="form-group">
                    <button type="button" id="submitBtn" class="btn btn-primary" style="width:100%;">💾 บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PWA Banner -->
    <div class="pwa-banner" id="pwaBanner">
        <div class="pwa-banner-icon">📲</div>
        <div class="pwa-banner-text">
            <strong>ติดตั้ง Portfolio Manager</strong>
            <span>ใช้งานได้เหมือนแอปบนมือถือ</span>
        </div>
        <div class="pwa-banner-actions">
            <button class="pwa-install-btn" id="pwaInstallBtn">ติดตั้ง</button>
            <button class="pwa-dismiss-btn" id="pwaDismissBtn">✕</button>
        </div>
    </div>

    <script>
    // ============================================================
    // ⚙️ CONFIG — เปลี่ยนแค่บรรทัดนี้
    // ============================================================
    const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL'; // ← ใส่ URL ของคุณที่นี่

    // ============================================================
    let portfolioData = [];
    let currentEditId = null;
    let imageBase64   = null;

    // ============================================================
    // โหลดข้อมูล
    // ============================================================
    async function loadPortfolio() {
        showLoading();
        try {
            // ✅ ใช้ no-cors ไม่ได้กับ JSON — ต้อง deploy Apps Script เป็น "Anyone"
            const res    = await fetch(APPS_SCRIPT_URL, { redirect: 'follow' });
            const result = await res.json();

            if (result.success) {
                portfolioData = result.data;
                renderPortfolio(portfolioData);
            } else {
                showError('โหลดข้อมูลไม่ได้: ' + result.error);
            }
        } catch (err) {
            showError('❌ เชื่อมต่อไม่ได้ — ตรวจสอบ APPS_SCRIPT_URL และ Deploy Settings');
            console.error(err);
        }
    }

    function showLoading() {
        document.getElementById('portfolioGrid').innerHTML =
            `<div class="loading-state"><div class="spinner"></div><span>กำลังโหลด...</span></div>`;
    }

    function showError(msg) {
        document.getElementById('portfolioGrid').innerHTML =
            `<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>${msg}</h3></div>`;
    }

    // ============================================================
    // Render
    // ============================================================
    function renderPortfolio(data) {
        const grid = document.getElementById('portfolioGrid');
        if (!data.length) {
            grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>ยังไม่มีผลงาน</h3><p>คลิก "เพิ่มผลงาน" เพื่อเริ่มต้น</p></div>`;
            return;
        }

        // ✅ ใช้ key ตรงๆ ตามชื่อ header: title, description, url, image_url, category, tags, date, id
        grid.innerHTML = data.map(item => {
            const tagsHtml = item.tags
                ? item.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')
                : '';
            const imgHtml = item.image_url
                ? `<img src="${item.image_url}" alt="${item.title}" onerror="this.parentElement.classList.add('no-image');this.remove();">`
                : '';

            return `
            <div class="portfolio-card">
                <div class="portfolio-image ${!item.image_url ? 'no-image' : ''}">
                    ${imgHtml || '🖼️'}
                </div>
                <div class="portfolio-content">
                    <div class="portfolio-title">${item.title || ''}</div>
                    <div class="portfolio-category">${item.category || ''}</div>
                    <div class="portfolio-description">${item.description || ''}</div>
                    ${tagsHtml ? `<div class="portfolio-tags">${tagsHtml}</div>` : ''}
                    <div class="portfolio-date">📅 ${item.date || ''}</div>
                    <div class="portfolio-actions">
                        <a href="${item.url}" target="_blank" rel="noopener" class="action-btn">🔗 เปิด</a>
                        <button class="action-btn copy" onclick="copyUrl('${item.url}')">📋 คัดลอก</button>
                        <button class="action-btn delete" onclick="deleteItem('${item.id}')">🗑️ ลบ</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    // ============================================================
    // ค้นหา & เรียงลำดับ
    // ============================================================
    document.getElementById('searchBox').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        renderPortfolio(portfolioData.filter(item =>
            (item.title || '').toLowerCase().includes(q) ||
            (item.description || '').toLowerCase().includes(q) ||
            (item.tags || '').toLowerCase().includes(q)
        ));
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
        const sorted = [...portfolioData];
        if (e.target.value === 'new') sorted.sort((a, b) => b.id - a.id);
        if (e.target.value === 'old') sorted.sort((a, b) => a.id - b.id);
        if (e.target.value === 'a-z') sorted.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        renderPortfolio(sorted);
    });

    // ============================================================
    // เปิด Modal
    // ============================================================
    document.getElementById('addBtn').addEventListener('click', () => {
        currentEditId = null;
        imageBase64   = null;
        document.getElementById('modalTitle').textContent = '➕ เพิ่มผลงานใหม่';
        ['f_title','f_description','f_url','f_category','f_tags','f_image_url'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('imagePreview').innerHTML = '';
        document.getElementById('addModal').classList.add('active');
    });

    // ============================================================
    // Submit — เพิ่ม/แก้ไข
    // ============================================================
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const title       = document.getElementById('f_title').value.trim();
        const description = document.getElementById('f_description').value.trim();
        const url         = document.getElementById('f_url').value.trim();
        const category    = document.getElementById('f_category').value.trim();

        if (!title || !description || !url || !category) {
            showToast('⚠️ กรุณากรอกข้อมูลที่มี * ให้ครบ', 'error');
            return;
        }

        // ใช้ URL รูปจาก input ก่อน ถ้าไม่มีค่อยใช้ base64
        const imageUrl = document.getElementById('f_image_url').value.trim() || imageBase64 || '';

        const params = new URLSearchParams({
            action:      currentEditId ? 'update' : 'add',
            title, description, url, category,
            tags:        document.getElementById('f_tags').value.trim(),
            image_url:   imageUrl,
            status:      'active'
        });
        if (currentEditId) params.set('id', currentEditId);

        document.getElementById('submitBtn').textContent = '⏳ กำลังบันทึก...';
        document.getElementById('submitBtn').disabled = true;

        try {
            // ✅ fetch POST ไปยัง Apps Script
            const res    = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: params, redirect: 'follow' });
            const result = await res.json();

            if (result.success) {
                showToast('✅ ' + result.message);
                closeModal();
                loadPortfolio();
            } else {
                showToast('❌ ' + result.error, 'error');
            }
        } catch (err) {
            showToast('❌ บันทึกไม่ได้: ' + err.message, 'error');
            console.error(err);
        } finally {
            document.getElementById('submitBtn').textContent = '💾 บันทึก';
            document.getElementById('submitBtn').disabled = false;
        }
    });

    // ============================================================
    // ลบ
    // ============================================================
    async function deleteItem(id) {
        if (!confirm('⚠️ ยืนยันการลบผลงานนี้?')) return;
        try {
            const res    = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body:   new URLSearchParams({ action: 'delete', id }),
                redirect: 'follow'
            });
            const result = await res.json();
            if (result.success) { showToast('✅ ' + result.message); loadPortfolio(); }
            else showToast('❌ ' + result.error, 'error');
        } catch (err) {
            showToast('❌ ' + err.message, 'error');
        }
    }

    // ============================================================
    // Image Upload (Base64 — สำหรับรูปเล็กๆ เท่านั้น)
    // ============================================================
    document.getElementById('imageUpload').addEventListener('click', () =>
        document.getElementById('f_imageFile').click());

    document.getElementById('imageUpload').addEventListener('dragover', e => {
        e.preventDefault(); document.getElementById('imageUpload').classList.add('drag-over');
    });
    document.getElementById('imageUpload').addEventListener('dragleave', () =>
        document.getElementById('imageUpload').classList.remove('drag-over'));
    document.getElementById('imageUpload').addEventListener('drop', e => {
        e.preventDefault();
        document.getElementById('imageUpload').classList.remove('drag-over');
        if (e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
    });
    document.getElementById('f_imageFile').addEventListener('change', e => {
        if (e.target.files[0]) handleImageFile(e.target.files[0]);
    });

    function handleImageFile(file) {
        if (!file.type.startsWith('image/')) { showToast('⚠️ โปรดเลือกไฟล์รูปภาพ', 'error'); return; }
        if (file.size > 200 * 1024) {
            showToast('⚠️ รูปใหญ่เกิน 200KB — แนะนำใช้ลิงก์รูปแทน', 'error'); return;
        }
        const reader = new FileReader();
        reader.onload = e => {
            imageBase64 = e.target.result;
            document.getElementById('imagePreview').innerHTML =
                `<img src="${imageBase64}" alt="preview">`;
        };
        reader.readAsDataURL(file);
    }

    // ============================================================
    // Utils
    // ============================================================
    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => showToast('✅ คัดลอก URL สำเร็จ!'));
    }

    function closeModal() {
        document.getElementById('addModal').classList.remove('active');
    }

    window.addEventListener('click', e => {
        if (e.target === document.getElementById('addModal')) closeModal();
    });

    function showToast(message, type = 'success') {
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3500);
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        loadPortfolio(); showToast('🔄 รีเฟรชแล้ว');
    });

    // ============================================================
    // เริ่มต้น
    // ============================================================
    loadPortfolio();

    // ============================================================
    // PWA
    // ============================================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(console.warn);
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault(); deferredPrompt = e;
        if (!localStorage.getItem('pwa-dismissed'))
            setTimeout(() => document.getElementById('pwaBanner').classList.add('show'), 2000);
    });
    document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        document.getElementById('pwaBanner').classList.remove('show');
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') showToast('🎉 ติดตั้งแอปสำเร็จ!');
    });
    document.getElementById('pwaDismissBtn').addEventListener('click', () => {
        document.getElementById('pwaBanner').classList.remove('show');
        localStorage.setItem('pwa-dismissed', '1');
    });
    window.addEventListener('appinstalled', () => {
        document.getElementById('pwaBanner').classList.remove('show');
        showToast('✅ แอปถูกเพิ่มใน Home Screen แล้ว!');
    });

    // Offline detection
    function updateOnlineStatus() {
        if (!navigator.onLine) {
            document.getElementById('offlineBar').classList.add('show');
        } else {
            document.getElementById('offlineBar').classList.remove('show');
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
    </script>
</body>
</html>
